; ESP32-2432S028 (Cheap Yellow Display / CYD 2.8" version)
; Display: ILI9341 240x320, Backlight: GPIO21
; SPI pins are the same as the ESP32-024 (MOSI13/MISO12/SCLK14/CS15/DC2).
; The previous board (ESP32-024, ST7789 / BL27 / BGR) needed different
; settings - a white screen on this board means the ST7789 driver was
; still selected, the ILI9341 panel cannot use those init commands.
; Colour notes for this board (standard CYD settings):
; - RGB order is standard: no TFT_RGB_ORDER flag (add
;   -DTFT_RGB_ORDER=TFT_BGR only if red/blue come out swapped)
; - Inversion OFF is the usual default (if black/white look inverted,
;   change to -DTFT_INVERSION_ON=1 and DISPLAY_INVERT true in main.cpp)

[env:esp32-2432s028]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; WiFi + TLS + JSON pushes the app past the default 1.25MB partition.
; huge_app gives ~3MB (USB upload only, no OTA partitions).
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    tedtoal/XPT2046_Touchscreen_TT @ ^1.8.1
    adafruit/Adafruit GFX Library @ ^1.12.1
    bblanchon/ArduinoJson @ ^7.4.1

build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_INVERSION_OFF=1
    -DUSE_HSPI_PORT
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
